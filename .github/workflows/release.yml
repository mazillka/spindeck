# Push a tag like v1.0.0 → builds the plugin and publishes a GitHub Release
# with the Decky install zip attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs the build tools, so it gets a read-only token; only the publish job
  # below can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check version matches tag
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Typecheck and backend tests
        run: |
          npx -p typescript@$(node -p "require('./package.json').devDependencies.typescript") tsc -p typecheck/tsconfig.json
          python3 tests/py/t.py

      - name: Build and package
        run: ./scripts/package.sh

      - name: Verify release package
        run: |
          v=$(node -p "require('./package.json').version")
          zip="release/spindeck-$v.zip"
          for f in spindeck/main.py spindeck/plugin.json spindeck/package.json spindeck/dist/index.js; do
            unzip -Z1 "$zip" | grep -Fx "$f" || { echo "$f missing from $zip"; exit 1; }
          done
          # The build injects the version (build/build.ts): the updater compares against it.
          unzip -p "$zip" spindeck/dist/index.js | grep -Fq "\"$v\"" || { echo "dist/index.js doesn't carry version $v"; exit 1; }
          sha256sum "$zip"

      - name: Release notes for this version
        run: |
          v=$(node -p "require('./package.json').version")
          awk -v ver="$v" '$0 == "## "ver {on=1; next} /^## / && on {exit} on' RELEASE_NOTES.md > release/notes.md
          [ -s release/notes.md ] || echo "Spindeck $v" > release/notes.md
          # The install link names the repository publishing it (the same on upstream; a fork's own release on a fork).
          sed -i "s#github.com/justinca92/spindeck/releases/download/#github.com/${GITHUB_REPOSITORY}/releases/download/#g" release/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/spindeck-*.zip
            release/notes.md
          if-no-files-found: error

  # ClamAV, VirusTotal and MetaDefender (scan.yml); never stops the release, the notes say what it found.
  scan:
    needs: build
    uses: ./.github/workflows/scan.yml
    secrets: inherit

  publish:
    needs: [build, scan]
    # A broken scan job never holds a release back: the notes say so.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: clamav-report

      - name: Security checks in the notes
        run: |
          zip=$(ls spindeck-*.zip)
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          link=""
          [[ -f "$report" ]] && link=" ([scan report](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${report}))"
          case "$RESULT" in
            clean) scan="ClamAV found no threats in \`$zip\`$link." ;;
            infected) scan="ClamAV flagged \`$zip\`: ${FOUND}$link. It may be a false positive; read the report before you install." ;;
            error) scan="ClamAV couldn't scan \`$zip\`$link." ;;
            *) scan="The ClamAV scan didn't run for this release." ;;
          esac
          line() { # name result detections url
            case "$2" in
              clean) echo "- **$1:** No engine flagged \`$zip\` ($3) — [report]($4)." ;;
              flagged) echo "- **$1:** $3 engines flagged \`$zip\` — [report]($4). Single detections are often false positives; read the report before you install." ;;
              pending) echo "- **$1:** hadn't finished when this release was published — [see its report]($4)." ;;
            esac
          }
          {
            printf '\n## Security checks\n\n- **Virus scan:** %s\n' "$scan"
            line VirusTotal "$VT_RESULT" "$VT_DETECTIONS" "$VT_URL"
            line MetaDefender "$MD_RESULT" "$MD_DETECTIONS" "$MD_URL"
            echo "- **Code analysis:** GitHub [CodeQL](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml) checks the Python and TypeScript code on every change."
          } >> notes.md
        env:
          RESULT: ${{ needs.scan.outputs.result }}
          FOUND: ${{ needs.scan.outputs.found }}
          VT_RESULT: ${{ needs.scan.outputs.vt-result }}
          VT_DETECTIONS: ${{ needs.scan.outputs.vt-detections }}
          VT_URL: ${{ needs.scan.outputs.vt-url }}
          MD_RESULT: ${{ needs.scan.outputs.md-result }}
          MD_DETECTIONS: ${{ needs.scan.outputs.md-detections }}
          MD_URL: ${{ needs.scan.outputs.md-url }}

      # GitHub's own CLI (preinstalled on the runner): no third-party code runs with the write token.
      # A tag like v1.5.0-rc.1 is a pre-release: GitHub never reports it as "latest",
      # so the in-panel updater (releases/latest) keeps offering stable versions only.
      - name: Create GitHub Release
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          shopt -s nullglob # the ClamAV report is missing when its scan job broke
          gh release create "$GITHUB_REF_NAME" spindeck-*.zip ClamAV-scan-*.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
